<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Password 🔐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff0f8,#f5e6ff,#fff5e6);padding:20px;}
.card{background:rgba(255,255,255,.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);
  border-radius:28px;padding:48px 40px;max-width:400px;width:100%;
  box-shadow:0 20px 60px rgba(233,30,140,.12);text-align:center;animation:fadeIn .6s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.icon{font-size:3.5rem;margin-bottom:16px;}
h1{font-family:'Dancing Script',cursive;font-size:2.2rem;color:#e91e8c;margin-bottom:8px;}
p{color:#9e7aa8;font-size:.9rem;margin-bottom:32px;}
label{display:block;text-align:left;font-size:.8rem;font-weight:600;color:#9e7aa8;margin-bottom:6px;letter-spacing:.5px;}
input{width:100%;padding:14px 16px;border:2px solid rgba(233,30,140,.2);border-radius:14px;
  font-size:1rem;font-family:'Poppins',sans-serif;color:#4a2a5a;background:rgba(255,255,255,.9);
  outline:none;transition:all .3s;text-align:center;letter-spacing:2px;}
input:focus{border-color:#e91e8c;box-shadow:0 0 0 3px rgba(233,30,140,.12);}
.btn{width:100%;padding:14px;margin-top:16px;background:linear-gradient(135deg,#e91e8c,#9c27b0);
  color:#fff;border:none;border-radius:14px;font-size:1rem;font-family:'Poppins',sans-serif;
  font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(233,30,140,.25);transition:all .3s;}
.btn:hover{transform:translateY(-2px);}
.back{display:inline-block;margin-top:20px;color:#9e7aa8;text-decoration:none;font-size:.85rem;}
.back:hover{color:#e91e8c;}
.msg{padding:12px;border-radius:10px;font-size:.85rem;margin-bottom:16px;background:rgba(244,67,54,.1);color:#c62828;border:1px solid rgba(244,67,54,.2);}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Manage Page</h1>
  <p>Enter the password to manage <strong>{{ dob }}</strong>'s birthday page</p>
  {% if messages %}{% for msg in messages %}<div class="msg">{{ msg }}</div>{% endfor %}{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Password</label>
    <input type="password" name="password" autofocus placeholder="••••••••" required>
    <button type="submit" class="btn">🔓 Enter Manage Page</button>
  </form>
  <a href="{% url 'birthday_page' dob=dob %}" class="back">← Back to birthday page</a>
</div>
</body>
</html>
