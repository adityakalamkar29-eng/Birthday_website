<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Birthday Page Found 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff0f8,#f5e6ff);padding:20px;text-align:center;}
.card{max-width:480px;padding:60px 40px;}
.icon{font-size:5rem;margin-bottom:24px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
h1{font-family:'Dancing Script',cursive;font-size:2.5rem;color:#e91e8c;margin-bottom:12px;}
p{color:#9e7aa8;margin-bottom:32px;line-height:1.7;}
.code{background:rgba(233,30,140,.08);border:1px solid rgba(233,30,140,.2);border-radius:10px;
  padding:8px 16px;font-family:monospace;color:#e91e8c;display:inline-block;margin-bottom:24px;}
.btn{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#e91e8c,#9c27b0);
  color:#fff;border-radius:14px;text-decoration:none;font-weight:600;margin:6px;
  box-shadow:0 6px 20px rgba(233,30,140,.25);transition:all .3s;}
.btn:hover{transform:translateY(-2px);}
.btn-outline{background:transparent;border:2px solid #e91e8c;color:#e91e8c;box-shadow:none;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎂</div>
  <h1>No Birthday Page Found</h1>
  <div class="code">{{ dob }}</div>
  <p>We couldn't find a birthday page for this date. Maybe it hasn't been created yet?</p>
  <a href="{% url 'home' %}" class="btn">🔍 Search Another Date</a>
  <a href="{% url 'create_page' %}" class="btn btn-outline">🎀 Create a Page</a>
</div>
</body>
</html>
